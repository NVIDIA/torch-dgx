name: Report a bug
description: Report reproducible behavior in torch-dgx that appears to be incorrect.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve torch-dgx.

        Do not disclose security vulnerabilities here. Follow [SECURITY.md](https://github.com/NVIDIA/torch-dgx/blob/master/SECURITY.md) to report them privately.

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Identify the affected torch-dgx package version or commit.
      placeholder: "For example: 1.0.0 or abc1234"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the software versions and GPU configuration used to reproduce the problem. Redact secrets and private data.
      placeholder: |
        OS and architecture:
        Python and PyTorch versions:
        CUDA toolkit and NVIDIA driver versions:
        GPU models, count, and interconnect (for example, NVLink or PCIe):
        CUDA_VISIBLE_DEVICES, if set:
        C++ compiler version:
        cuDNN, NCCL, and CUTLASS versions, if relevant:
        Installation method and build command:
        Container image, if applicable:
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: |
        Provide a minimal example in the form of a standalone Python script and the output of `nvidia-smi`. For correctness comparisons, compute reference results with CPU PyTorch; do not mix PyTorch's CUDA and DGX backends in the same process. See [CONTRIBUTING.md](https://github.com/NVIDIA/torch-dgx/blob/master/CONTRIBUTING.md) for guidance.
      placeholder: |
        Minimal code, configuration, or data:
        Required setup:
        Exact commands:
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Explain what you expected to happen, including CPU PyTorch reference results where relevant.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Explain what happened instead. Include relevant errors, tracebacks, logs, or screenshots after removing sensitive information.
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add regression details, workarounds, related issues, or anything else that helps diagnose the problem.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed secrets, credentials, private links, and sensitive data from this report.
          required: true
